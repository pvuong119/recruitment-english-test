<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speaking recorder</title><style>/* ================= OCEAN THEME · view from the seabed ================= */
:root{color-scheme:light}
html,body{margin:0;min-height:100%;background:#04223d}
.sea{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;contain:strict;
  background:linear-gradient(180deg,#aee8f1 0%,#58c3db 9%,#1d93bd 24%,#0e6c9a 44%,#08507c 64%,#053559 82%,#03203a 100%)}
/* sun, slanting from the upper left */
.sea-sun{position:absolute;left:-18vmax;top:-34vmax;width:78vmax;height:78vmax;border-radius:50%;
  background:radial-gradient(circle,rgba(255,251,228,1) 0%,rgba(255,243,196,.75) 9%,rgba(214,246,250,.35) 26%,rgba(160,228,242,0) 58%);
  animation:seaGlow 9s ease-in-out infinite;will-change:opacity}
/* light shafts entering at an angle */
.sea-rays{position:absolute;left:-30vw;top:-20vh;width:140vw;height:150vh;transform-origin:0 0;transform:rotate(-18deg);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 46px,rgba(255,252,232,.16) 52px 68px,rgba(255,255,255,0) 78px 132px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 38%,transparent 78%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 38%,transparent 78%);
  filter:blur(5px);animation:seaShaft 14s ease-in-out infinite alternate;will-change:transform,opacity}
.sea-rays.b{opacity:.65;transform:rotate(-24deg);animation-duration:21s;animation-direction:alternate-reverse;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 80px,rgba(220,250,255,.13) 88px 98px,rgba(255,255,255,0) 110px 190px)}
/* rippling water surface */
.sea-surface{position:absolute;left:0;right:0;top:0;height:20vh;overflow:hidden;
  -webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
.sea-surface i{position:absolute;left:0;top:0;width:200%;height:100%;opacity:.55;mix-blend-mode:screen;
  background:
    radial-gradient(ellipse 70px 12px at 25% 30%,rgba(255,255,255,.75),transparent 70%),
    radial-gradient(ellipse 110px 16px at 60% 18%,rgba(255,255,255,.55),transparent 70%),
    radial-gradient(ellipse 80px 10px at 82% 52%,rgba(255,255,255,.6),transparent 70%),
    radial-gradient(ellipse 50px 8px at 40% 66%,rgba(255,255,255,.45),transparent 70%);
  background-size:300px 110px,380px 130px,260px 100px,210px 90px;animation:seaRipple 26s linear infinite;will-change:transform}
.sea-surface i+i{opacity:.35;animation-duration:38s;animation-direction:reverse;background-size:340px 120px,280px 140px,320px 90px,240px 80px}
.sea-wave{position:absolute;left:0;top:7vh;width:200%;height:40px;opacity:.35;animation:seaRipple 18s linear infinite;will-change:transform}
/* soft caustic light on the water */
.sea-caustic{position:absolute;inset:-10% -10% 30% -10%;opacity:.12;mix-blend-mode:screen;
  background:radial-gradient(circle at 30% 30%,#fff 0 1.5px,transparent 38px),radial-gradient(circle at 70% 70%,#fff 0 1.5px,transparent 46px);
  background-size:170px 150px,230px 200px;animation:seaDrift 40s linear infinite;will-change:transform}
.sea-deep{position:absolute;left:0;right:0;bottom:0;height:45vh;background:linear-gradient(transparent,rgba(1,12,24,.6))}
/* tiny bubbles */
.sea-b{position:absolute;bottom:-30px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;opacity:0;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,.2) 42%,rgba(255,255,255,.04) 72%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);animation:seaRise var(--d) linear var(--dl) infinite;will-change:transform,opacity}
/* minimal fish silhouettes, far away */
.sea-fish{position:absolute;left:-80px;top:var(--y);width:var(--w);opacity:var(--o);color:#062a47;animation:seaSwim var(--d) linear var(--dl) infinite;will-change:transform}
.sea-fish svg{display:block;width:100%;height:auto;animation:seaBob 3.2s ease-in-out infinite}
.sea-fish.l{left:auto;right:-80px;animation-name:seaSwimL}
.sea-fish.l svg{transform:scaleX(-1);animation-name:seaBobL}
@keyframes seaGlow{0%,100%{opacity:.9}50%{opacity:1}}
@keyframes seaShaft{0%{transform:rotate(-18deg) translateX(0);opacity:.85}100%{transform:rotate(-14deg) translateX(4vw);opacity:1}}
@keyframes seaRipple{to{transform:translateX(-50%)}}
@keyframes seaDrift{to{transform:translate(-170px,120px)}}
@keyframes seaRise{0%{transform:translate(0,0);opacity:0}8%{opacity:.85}50%{transform:translate(12px,-55vh)}92%{opacity:.6}100%{transform:translate(-6px,-110vh);opacity:0}}
@keyframes seaSwim{to{transform:translateX(calc(100vw + 160px))}}
@keyframes seaSwimL{to{transform:translateX(calc(-100vw - 160px))}}
@keyframes seaBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes seaBobL{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-6px)}}
@media (max-width:700px){.sea-fish{display:none}.sea-rays.b{display:none}}
@media (prefers-reduced-motion:reduce){.sea *,.sea *::before{animation:none !important}.sea-b{display:none}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
#remaining{margin:0;padding:6px 12px;border-radius:999px;background:#eef6fb;color:#1479a8;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
#remaining:empty{display:none}
.prompt{margin:16px 0 4px;padding:16px 18px;border-radius:18px;background:linear-gradient(180deg,#f3f9fd,#eaf4fa);border:1px solid #d3e6f1}
#prompt{margin:0;font-size:16.5px;font-weight:600;color:#0f2236}
#lines{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#lines:empty{display:none}
.stage{position:relative;margin:18px 0 6px;padding:22px 20px 18px;border-radius:22px;text-align:center;
  background:linear-gradient(180deg,#0b4f7a,#08385b);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.dot{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45)}
body[data-state=recording] .dot::before{background:#ff5d5d;animation:blink 1s ease-in-out infinite}
body[data-state=paused] .dot::before{background:#ffc857}
body[data-state=ready] .dot::before{background:#4ade80}
@keyframes blink{50%{opacity:.25}}
#timer{margin:6px 0 10px;font-size:52px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
canvas{display:block;width:100%;height:64px;border-radius:14px;background:rgba(255,255,255,.08)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 12px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;
  color:#0f2236;background:#fff;box-shadow:inset 0 0 0 1.5px #c9dbe8;transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s,background-color .2s,opacity .2s}
button svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
button:not(:disabled):hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1.5px #1479a8,0 10px 20px -14px rgba(5,40,75,.7)}
button:disabled{opacity:.38;cursor:default}
.stage button{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.stage button:not(:disabled):hover{background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
#start{background:linear-gradient(135deg,#ef4444,#c81e1e);box-shadow:0 12px 22px -12px rgba(200,30,30,.9)}
#start svg{fill:#fff}
#stop:not(:disabled){background:#fff;color:#08385b}
#delete{color:#c81e1e}
#play{color:#1479a8}
.chip{min-height:38px;padding:6px 14px;font-size:14px;border-radius:999px;color:#1479a8}
audio{display:block;width:100%;margin:14px 0 0;height:44px;border-radius:12px}
audio[hidden]{display:none}
#status{margin:14px 0 0;padding:10px 14px;border-radius:12px;background:#f2f7fb;color:#33475c;font-size:14.5px;font-weight:600}
.foot{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:16px}
#use{background:linear-gradient(135deg,#172958,#1f5a8c);color:#fff;box-shadow:0 12px 22px -12px rgba(5,40,75,.9)}
#use svg{stroke:#fff}
#cancel{color:#53657a}
.note{margin:14px 0 0;color:#53657a;font-size:13.5px;text-align:center}
@media (max-width:560px){main{padding:20px 16px;border-radius:22px}.tools{gap:8px}.tools button{font-size:14px;padding:8px 6px;gap:6px;white-space:nowrap}.controls{grid-template-columns:repeat(2,1fr)}#timer{font-size:44px}.foot{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
