<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speaking recorder</title><style>
body{font:16px system-ui;background:#f3f6fa;color:#172958;margin:0;padding:20px}main{max-width:650px;margin:auto;background:white;padding:24px;border-radius:16px}button{font:inherit;padding:10px 14px;margin:4px;border:1px solid #172958;background:#172958;color:white;border-radius:8px;cursor:pointer}button:disabled{opacity:.4;cursor:default}#start,#delete{background:#b91c1c}#timer{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums}canvas{width:100%;height:64px;background:#eef2f8;border-radius:8px}audio{width:100%;margin:12px 0}p{line-height:1.5}</style></head><body><main><h1>Speaking recorder</h1><p id="prompt">Connecting to the test…</p><div id="lines"></div><p id="remaining"></p><div id="timer">00:00</div><canvas id="wave" width="600" height="64"></canvas><div><button id="start" disabled>Start</button><button id="pause" disabled>Pause</button><button id="resume" disabled>Resume</button><button id="stop" disabled>Stop</button><button id="delete" disabled>Delete</button><button id="again" disabled>Re-record</button></div><audio id="audio" controls hidden></audio><p id="status" role="status">Connecting…</p><button id="use" disabled>Save recording & return</button><button id="cancel">Cancel</button><p>Microphone audio stays in this browser until you save it to the test. Recruitment receives it when you submit the test.</p></main><script>
'use strict';const $=id=>document.getElementById(id), nonce=location.hash.slice(1);let parentOrigin='', deadline=0, rec, stream, chunks=[], blob, url, ctx, analyser, started=0, elapsed=0, sec=0, expired=false, sent=false, busy=false, cancelled=false;
function status(s){$('status').textContent=s}function controls(){const state=rec?.state||'inactive', ready=!!deadline&&!expired&&!sent&&!busy;$('start').disabled=!ready||state!=='inactive'||!!blob;$('pause').disabled=!ready||state!=='recording';$('resume').disabled=!ready||state!=='paused';$('stop').disabled=busy||state==='inactive'||sent;$('delete').disabled=!ready||!blob||state!=='inactive';$('again').disabled=$('delete').disabled;$('use').disabled=!blob||state!=='inactive'||sent||busy;}
function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function cleanup(){stream?.getTracks().forEach(t=>t.stop());stream=null;if(ctx){ctx.close().catch(()=>{});ctx=null;}analyser=null;}
function reset(){if(url)URL.revokeObjectURL(url);url=null;blob=null;sec=0;elapsed=0;$('audio').removeAttribute('src');$('audio').hidden=true;controls();}
async function start(){if(busy||expired||!deadline)return;busy=true;controls();try{stream=await navigator.mediaDevices.getUserMedia({audio:true});if(expired||cancelled){cleanup();return;}const types=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});chunks=[];elapsed=0;started=Date.now();rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onerror=()=>{cleanup();status('Recording failed. Try again.');controls()};rec.onstop=()=>{blob=new Blob(chunks,{type:rec.mimeType||chunks[0]?.type});cleanup();busy=false;if(!blob.size){blob=null;status('No audio captured. Try again.');controls();return;}url=URL.createObjectURL(blob);$('audio').src=url;$('audio').hidden=false;status('Recording ready. Listen, delete or save.');controls();if(expired&&!cancelled)send();};rec.start();try{ctx=new AudioContext();analyser=ctx.createAnalyser();analyser.fftSize=256;ctx.createMediaStreamSource(stream).connect(analyser);ctx.resume().catch(()=>{});}catch{}status('Recording…');}catch(e){cleanup();status('Microphone error: '+e.message)}finally{busy=false;controls()}}
function stop(){if(rec&&rec.state!=='inactive'){if(rec.state==='recording')elapsed+=Date.now()-started;sec=Math.round(elapsed/1000);busy=true;rec.stop();controls();}}
function send(){if(!blob||sent||cancelled)return;const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';if(blob.size>10*1024*1024){status('Recording is too large.');return;}sent=true;controls();status('Returning recording to your test…');window.opener.postMessage({type:'recording',nonce,blob,ext,seconds:sec},parentOrigin);setTimeout(()=>{if(sent){sent=false;controls();status('No confirmation yet. Keep the test open and retry.');}},2500)}
function expire(){if(expired)return;expired=true;if(rec&&rec.state!=='inactive')stop();else if(blob)send();else status('Speaking time expired.');controls()}
$('start').onclick=start;$('pause').onclick=()=>{if(rec?.state==='recording'){elapsed+=Date.now()-started;rec.pause();status('Paused');controls()}};$('resume').onclick=()=>{if(rec?.state==='paused'){started=Date.now();rec.resume();status('Recording…');controls()}};$('stop').onclick=stop;$('delete').onclick=()=>{reset();status('Recording deleted.')};$('again').onclick=()=>{reset();start()};$('use').onclick=send;$('cancel').onclick=()=>{cancelled=true;stop();cleanup();if(parentOrigin)window.opener?.postMessage({type:'cancel',nonce},parentOrigin);window.close()};
window.addEventListener('message',e=>{if(e.source!==window.opener||!e.data||e.data.nonce!==nonce)return;const d=e.data;if(d.type==='config'&&!parentOrigin){if(!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(e.origin)&&e.origin!=='https://script.google.com')return;parentOrigin=e.origin;deadline=Number(d.deadline);$('prompt').textContent=String(d.prompt||'');for(const [i,line] of (d.lines||[]).entries()){const b=document.createElement('button');b.textContent='Play customer line '+(i+1);let plays=0;b.onclick=()=>{if(plays>=2)return;plays++;let u=new SpeechSynthesisUtterance(line);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);if(plays>=2)b.disabled=true};$('lines').append(b)}const q=document.createElement('button');q.textContent='Listen to question';let n=0;q.onclick=()=>{if(n++>=2)return;let u=new SpeechSynthesisUtterance(d.prompt);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);if(n>=2)q.disabled=true};$('lines').prepend(q);status('Ready. Click Start.');controls();}else if(e.origin===parentOrigin&&d.type==='expire')expire();else if(e.origin===parentOrigin&&d.type==='ack'){status('Saved. Return to the test.');window.close();}});
const ready=setInterval(()=>{if(parentOrigin){clearInterval(ready);return;}if(window.opener&&nonce)window.opener.postMessage({type:'ready',nonce},'*');else status('Open this recorder from your recruitment test.');},400);
setInterval(()=>{if(deadline){const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('remaining').textContent='Speaking time remaining: '+format(left);if(!left)expire();}const t=rec?.state==='recording'?elapsed+Date.now()-started:elapsed;$('timer').textContent=format(Math.floor(t/1000));const c=$('wave'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.fillStyle='#172958';if(analyser&&rec?.state==='recording'){const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(a);for(let i=0;i<60;i++){const h=Math.max(2,a[i]/255*60);g.fillRect(i*10,(64-h)/2,5,h)}}else g.fillRect(0,31,600,2);},100);
window.addEventListener('pagehide',cleanup);
</script></body></html>
